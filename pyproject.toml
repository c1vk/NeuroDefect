[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurodefect"
version = "0.2.0"
description = "GA + softmax BPN + Mamdani fuzzy software defect risk prediction"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=2.0", "scikit-learn>=1.5", "streamlit>=1.39", "plotly>=5.24",
  "deap>=1.4", "imbalanced-learn>=0.12", "joblib>=1.4", "PyYAML>=6.0", "openpyxl>=3.1",
  "scikit-fuzzy>=0.5", "matplotlib>=3.8", "radon>=6.0", "shap>=0.46",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
neurodefect = "src.cli.main:main"

[tool.setuptools.packages.find]
include = ["src*", "neurodefect*"]
